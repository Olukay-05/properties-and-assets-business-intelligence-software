; Project-local PHP configuration for the development machine.
;
; The system-wide PHP install (C:\Program Files\php-8.5.12-1-Win32-vs17-x64)
; ships php.ini with openssl / curl / mbstring enabled and every other
; extension commented out. Laravel 13 + Pest + PostGIS work needs more
; (pdo_pgsql, sqlite for unit tests, zip for Composer, fileinfo, intl, gd),
; so this file re-declares the system set and adds the required ones.
;
; Use it via tools\php.bat or the tools\phpshim\php.bat PATH shim.
; The system install is never modified.

extension_dir = "C:\Program Files\php-8.5.12-1-Win32-vs17-x64\ext"

; Mirrors the system php.ini
extension=curl
extension=mbstring
extension=openssl

; Required by the application
extension=pdo_pgsql
extension=pgsql
extension=pdo_sqlite
extension=sqlite3
extension=zip
extension=fileinfo
extension=intl
extension=gd

memory_limit = 512M
date.timezone = "Africa/Lagos"
upload_max_filesize = 12M
post_max_size = 12M
