name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # Same database engine as production (AD-19): PostgreSQL 17 with PostGIS.
      # The suite never falls back to SQLite or a superuser connection.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: property_asset_intelligence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d property_asset_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # AUTHORITATIVE SOURCE for every database connection detail in this job.
      #
      # Every consumer reads these, so nothing can drift apart:
      #   - the postgres service publishes 5432:5432 and uses ADMIN_DB_*;
      #   - phpunit.xml pins 5433 for the LOCAL docker-compose stack, and this
      #     env block overrides that value in CI;
      #   - tools/create-test-database.php reads TEST_DB_*/DB_* and ADMIN_DB_*.
      #
      # ADMIN_DB_* and PAI_*_PASSWORD live at job level on purpose. The script
      # runs twice: once as its own provisioning step, and again via
      # `composer ci:check` -> `@isolation` -> `@db:setup`. Setting them per
      # step left the second run falling back to the script's local defaults
      # (`pai`/`secret`), which failed CI authentication. Job-level env is the
      # only place every invocation sees them.
      #
      # To move the port, change DB_PORT here and the `ports:` mapping above.
      # phpunit.xml needs no change; it is the local default.
      #
      # Runtime role: non-owner, NOBYPASSRLS.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: property_asset_intelligence_test
      DB_USERNAME: pai_app
      DB_PASSWORD: pai_app_local_only
      DB_APP_USERNAME: pai_app
      DB_APP_PASSWORD: pai_app_local_only
      # Schema owner: owns tables and policies, used only by `migrate`.
      DB_MIGRATION_USERNAME: pai_owner
      DB_MIGRATION_PASSWORD: pai_owner_local_only
      DB_SSLMODE: prefer
      # Superuser for role/database creation. Test-only: this is the
      # throwaway service container, never a real environment. Run against
      # DB_DATABASE, which the service container creates (POSTGRES_DB below).
      ADMIN_DB_DATABASE: ${{ env.DB_DATABASE }}
      ADMIN_DB_USERNAME: postgres
      ADMIN_DB_PASSWORD: postgres
      PAI_OWNER_PASSWORD: pai_owner_local_only
      PAI_APP_PASSWORD: pai_app_local_only

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # composer.json requires ^8.4
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, fileinfo, intl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Enable pnpm
        # `actions/setup-node` installs Node but not pnpm, so `pnpm install`
        # failed with exit 127 ("pnpm: command not found") and the job never
        # reached the isolation gate. Corepack ships with Node and reads the
        # exact version pinned in package.json (`packageManager`), so CI and a
        # developer machine get the same pnpm without a third-party action.
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Provision database roles
        # Creates pai_owner, pai_app and pai_bootstrap. The runtime role is
        # NOBYPASSRLS; only the pre-tenant lookup function owner bypasses RLS.
        # This must run before any migration, because the schema owner owns
        # tables and cannot create roles itself.
        #
        # Connection details and passwords come from the job-level env, which
        # is the same set `composer ci:check` picks up when it re-runs this
        # script through @isolation -> @db:setup. Nothing is restated here, so
        # the two invocations cannot disagree.
        run: php tools/create-test-database.php

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend assets
        run: pnpm run build

      - name: Run CI Checks
        run: composer ci:check
